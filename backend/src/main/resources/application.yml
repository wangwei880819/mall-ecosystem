server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/igou_mall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.igou.mall.model.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: true
    aggressive-lazy-loading: false

logging:
  level:
    com.igou.mall: DEBUG
    com.igou.mall.dao: DEBUG

jwt:
  secret: igou_mall_jwt_secret_key_2026
  expiration: 86400000
  refresh-expiration: 604800000

performance:
  max-concurrent: 300
  avg-response-ms: 500
  max-response-ms: 2000
  availability: 99.99